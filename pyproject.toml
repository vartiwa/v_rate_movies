[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fandango-ratings-analytics"
version = "1.0.0"
description = "Audited and production-ready data analytics platform investigating Fandango movie rating bias and temporal shifts."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Data Analytics Engineering" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
